name: build-apk
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Install Flet and dependencies
        run: |
          pip install flet==0.28.2
          pip install python-dotenv groq

      - name: Unzip and Build APK
        run: |
          if [ -f "JARVIS-Dina.zip" ]; then
            unzip -o JARVIS-Dina.zip
          fi
          cd JARVIS-Dina
          flet build apk --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: |
            JARVIS-Dina/build/apk
            build/apk
          if-no-files-found: error
