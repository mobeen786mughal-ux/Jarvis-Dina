name: JARVIS-Full-Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Ek sath 2 build ko takrane se rokta hai
concurrency:
  group: jarvis-build
  cancel-in-progress: false

jobs:
  # ================= APK BUILD (Android) =================
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Flutter and Flet
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.flet
            /opt/hostedtoolcache/flutter
          key: ${{ runner.os }}-flutter-3.35.4-flet-0.28.2-v1
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Setup Flutter 3.35.4 (Dart 3.9 Fix)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Flutter Doctor Check
        run: flutter doctor -v

      - name: Install Flet 0.28.2
        run: |
          pip install --upgrade pip
          pip install flet==0.28.2
          flet --version

      - name: Extract JARVIS Project
        run: |
          echo "Checking for zip..."
          ls -la
          if [ -f "JARVIS-Dina.zip" ]; then
            echo "Found JARVIS-Dina.zip, extracting..."
            rm -rf temp_extract
            mkdir temp_extract
            unzip -o JARVIS-Dina.zip -d temp_extract
            rm -rf JARVIS-Dina
            mv temp_extract/JARVIS-Dina ./JARVIS-Dina || mv temp_extract/* ./JARVIS-Dina || true
            rm -rf temp_extract
          fi
          echo "Project structure:"
          ls -la JARVIS-Dina/ || ls -la
          # Remove .env if exists to avoid build fail
          rm -f JARVIS-Dina/.env
          rm -f .env

      - name: Build APK (Verbose)
        working-directory: ./JARVIS-Dina
        run: |
          echo "Starting APK build..."
          flutter clean || true
          flet build apk --verbose

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK-${{ github.run_number }}
          path: |
            JARVIS-Dina/build/apk
            JARVIS-Dina/build/*.apk
          if-no-files-found: warn
          retention-days: 10

  # ================= WINDOWS EXE BUILD =================
  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter 3.35.4 (Dart 3.9 Fix)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.28.2

      - name: Extract Project
        run: |
          dir
          if (Test-Path "JARVIS-Dina.zip") {
            Write-Host "Extracting JARVIS-Dina.zip"
            Expand-Archive -Force JARVIS-Dina.zip . -ErrorAction SilentlyContinue
          }
          if (Test-Path "JARVIS-Dina") { dir JARVIS-Dina }
          Remove-Item JARVIS-Dina/.env -ErrorAction SilentlyContinue
          Remove-Item .env -ErrorAction SilentlyContinue

      - name: Build Windows EXE
        working-directory: ./JARVIS-Dina
        run: |
          flet build windows --verbose

      - name: Upload EXE Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-EXE-${{ github.run_number }}
          path: |
            JARVIS-Dina/build/windows
            JARVIS-Dina/build/
          if-no-files-found: warn
          retention-days: 10
