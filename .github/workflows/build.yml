name: build-apk
on: [push]
concurrency:
  group: build-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
      - run: yes | flutter doctor --android-licenses
      - run: pip install flet==0.28.2
      - name: Build APK
        run: |
          if [ -f "JARVIS-Dina.zip" ]; then
            rm -rf temp_extract
            mkdir temp_extract
            unzip -o JARVIS-Dina.zip -d temp_extract
            rm -rf JARVIS-Dina
            mv temp_extract/JARVIS-Dina ./JARVIS-Dina
            rm -rf temp_extract
          fi
          rm -f JARVIS-Dina/.env
          cd JARVIS-Dina
          flet build apk
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: JARVIS-Dina/build/apk
