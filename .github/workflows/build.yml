name: build-apk
on: [push]

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Install Flet
        run: pip install flet==0.28.2

      - name: Build APK
        run: |
          if [ -f "JARVIS-Dina.zip" ]; then
            unzip -o JARVIS-Dina.zip
            rm -f JARVIS-Dina/.env
          fi
          ls -la
          ls -la JARVIS-Dina || true
          cd JARVIS-Dina
          rm -f .env
          flet build apk --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: JARVIS-Dina/build/apk
